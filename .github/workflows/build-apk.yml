name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # secrets 上下文在 step 的 if 里不可用(条件永远为假),必须经 job 级 env 中转
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工程要求 JDK 25：gradle/gradle-daemon-jvm.properties 里 toolchainVersion=25，
      # AGP 9.x 也需要较新的 JDK。版本对不上会直接构建失败。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk=37（Android 17）。runner 自带的 SDK 不一定有该平台，先尝试安装；
      # 装不上也不让这一步失败，后面 Gradle 会给出明确报错。
      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-37" "platforms;android-37.0" "build-tools;37.0.0"; do
            sdkmanager --install "$pkg" > /dev/null 2>&1 || echo "skip $pkg"
          done
          sdkmanager --list_installed || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 单元测试先跑,逻辑改动挂了能立刻在 CI 上看到
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # ---- 以下为可选的 release 签名 ----
      # 仓库 Settings → Secrets and variables → Actions 里配置：
      #   KEYSTORE_B64       release.keystore 的 base64（base64 -w0 release.keystore）
      #   KEYSTORE_PASSWORD  storePassword
      #   KEY_ALIAS          keyAlias
      #   KEY_PASSWORD       keyPassword
      # 没配这几个 secret 时自动跳过，只出 debug APK（LSPosed 认，只是升级时必须同签名）。
      - name: Restore keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          cat > keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Assemble release APK
        if: env.KEYSTORE_B64 != ''
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 打 tag（例如 v1.1.1）推送后，自动把 APK 挂到 Release 上
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
